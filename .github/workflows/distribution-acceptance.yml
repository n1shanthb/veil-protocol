name: Distribution Acceptance

on:
  push:
    branches: [feature/developer-distribution, main]
  pull_request:

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install pinned Gno v1.8.0-rc.1
        shell: bash
        run: |
          git clone --depth 1 --branch v1.8.0-rc.1 https://github.com/gnolang/gno.git /tmp/gno-src
          cd /tmp/gno-src/gnovm/cmd/gno && go install .
          GOBIN_DIR="$(go env GOPATH)/bin"
          if command -v cygpath >/dev/null 2>&1; then
            GOBIN_DIR="$(cygpath -w "$GOBIN_DIR")"
          fi
          echo "$GOBIN_DIR" >> "$GITHUB_PATH"
      - run: cd sdk && npm ci && npm run build && npm test
      - run: node --test ./packages/cli/test/cli.test.mjs ./packages/mcp/test/mcp.test.mjs
      - name: Run external acceptance
        shell: bash
        run: node ./scripts/external-acceptance.mjs | tee acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-log-${{ matrix.os }}
          path: acceptance.log
